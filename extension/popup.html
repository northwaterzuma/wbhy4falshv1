<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>RustCatch 捕获与下载面板</title>
  <style>
    body { font-family: sans-serif; width: 360px; margin: 12px; background: #f8fafc; color: #0f172a; }
    h1 { font-size: 14px; margin: 0 0 8px; color: #1d4ed8; }
    .status { font-size: 12px; padding: 6px 8px; background: #e0f2fe; border-radius: 4px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>RustCatch 浏览器下载接管</h1>
  <div class="status" id="bridge-status" aria-live="polite"></div>
  <form id="rule">
    <p><label>允许接管的文件链接 <input id="url" type="url" required></label></p>
    <p><label><input id="confirmation" type="checkbox"> 此链接无需登录，允许重复下载</label></p>
    <p><button type="submit">启用此链接</button> <button id="disable" type="button">关闭接管</button></p>
  </form>
  <button id="retry" type="button">核对并重试交接</button>
  <script src="popup.js"></script>
</body>
</html>
